<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренажёры по русскому языку</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .container { width: min(800px, 100%); text-align: center; }
    h1 { color: #1e293b; font-size: clamp(24px, 5vw, 36px); margin-bottom: 10px; }
    p { color: #64748b; font-size: 16px; margin-bottom: 40px; }
    
    .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 600px) { .menu { grid-template-columns: 1fr; } }
    
    .card {
      background: #fff; padding: 30px 20px; border-radius: 20px;
      text-decoration: none; color: inherit;
      border: 2px solid #e2e8f0; transition: 0.2s;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .card:hover {
      transform: translateY(-5px); border-color: #7c3aed;
      box-shadow: 0 15px 35px rgba(124, 58, 237, 0.15);
    }
    .card-icon { font-size: 48px; margin-bottom: 15px; }
    .card-title { font-size: 20px; font-weight: 800; color: #1e293b; margin-bottom: 10px; }
    .card-sub { font-size: 14px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Тренажёры по русскому языку</h1>
    <p>Выберите задание для подготовки к ЕГЭ</p>
    
    <div class="menu">
      <a href="udarenie.html" class="card">
        <div class="card-icon">🔤</div>
        <div class="card-title">Постановка ударения</div>
        <div class="card-sub">Задание 4</div>
      </a>
      
      <a href="korni.html" class="card">
        <div class="card-icon">🌱</div>
        <div class="card-title">Корни с чередованием</div>
        <div class="card-sub">Задание 9</div>
      </a>
    </div>
  </div>
</body>
</html>
