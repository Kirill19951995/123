<html lang="ru">

  <title>Безударные непроверяемые гласные в корне слова — тест 11 класс</title>

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .app { width: min(860px, 100%); }

    header { text-align: center; margin-bottom: 18px; }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 32px);
      line-height: 1.2;
      color: #1e3a8a;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #dbeafe;
      border-radius: 22px;
      box-shadow: 0 20px 45px rgba(30, 64, 175, 0.12);
      padding: clamp(18px, 4vw, 32px);
      backdrop-filter: blur(8px);
    }

    .hidden { display: none !important; }

    .btn {
      border: 0;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      transition: 0.2s ease;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
    }

    .btn:hover:not(:disabled) { background: #1d4ed8; transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 10px;
    }

    .bar {
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .bar__fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #06b6d4);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    h2 {
      margin: 0 0 18px;
      font-size: clamp(18px, 3vw, 22px);
      color: #1e293b;
      text-align: center;
    }

    .word {
      text-align: center;
      font-size: clamp(24px, 5vw, 42px);
      font-weight: 800;
      letter-spacing: 0.4px;
      color: #0f172a;
      margin: 18px 0 24px;
      word-break: break-word;
      line-height: 1.3;
    }

    .blank {
      display: inline-block;
      width: 1.05em;
      height: 1em;
      border-bottom: 4px solid #2563eb;
      margin: 0 0.08em;
      vertical-align: -0.08em;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 0 0 18px;
    }

    .blank-group {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px;
    }

    .blank-label {
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .letter-options {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .option {
      flex: 1;
      border: 2px solid #cbd5e1;
      background: #fff;
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 26px;
      font-weight: 800;
      color: #1e293b;
      cursor: pointer;
      transition: 0.18s ease;
      max-width: 150px;
    }

    .option:hover:not(:disabled) {
      border-color: #2563eb;
      background: #eff6ff;
      transform: translateY(-1px);
    }

    .option:disabled { cursor: default; }

    .option.selected {
      border-color: #2563eb;
      background: #dbeafe;
      color: #1e3a8a;
    }

    .option.correct {
      border-color: #16a34a;
      background: #dcfce7;
      color: #166534;
    }

    .option.wrong {
      border-color: #dc2626;
      background: #fee2e2;
      color: #991b1b;
    }

    .feedback {
      min-height: 28px;
      line-height: 1.5;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      margin: 0 0 14px;
    }

    .feedback.ok {
      background: #ecfdf5;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .feedback.bad {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Панель ошибок сверху */
    .wrong-panel {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 16px;
    }

    .wrong-panel__label {
      font-size: 13px;
      font-weight: 700;
      color: #991b1b;
      margin-bottom: 6px;
    }

    .wrong-panel__list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 72px;
      overflow-y: auto;
    }

    .wrong-word {
      display: inline-block;
      background: #fff;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 13px;
      color: #991b1b;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Результаты */
    .result { text-align: center; }

    .result__wrong {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 18px;
      text-align: left;
    }

    .result__wrong-title {
      font-size: 13px;
      font-weight: 700;
      color: #991b1b;
      margin-bottom: 8px;
    }

    .result__wrong-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .result__wrong-list .wrong-word {
      background: #fff;
      padding: 3px 10px;
      font-size: 14px;
    }

    .result__score {
      font-size: clamp(34px, 7vw, 58px);
      font-weight: 900;
      color: #1e3a8a;
      margin: 8px 0;
    }

    .result__percent {
      font-size: 22px;
      font-weight: 700;
      color: #0e7490;
      margin-bottom: 12px;
    }

    .result__mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #dbeafe;
      color: #1e40af;
      font-size: 38px;
      font-weight: 900;
      margin: 10px 0 14px;
    }

    .result__message {
      color: #475569;
      font-size: 17px;
      line-height: 1.55;
      margin-bottom: 22px;
    }

    @media (max-width: 520px) {
      .topline { font-size: 13px; }
      .option { font-size: 23px; padding: 11px 8px; }
    }
  </style>

    ];

    const VOWELS = "аеёиоуыэюя";
    const MAX_BLANKS = 2;
    const STRESS_MARK = "\u0301";
    const MAX_ATTEMPTS = 3;
    const MIN_OFFSET = 3;
    const MAX_OFFSET = 5;

    const CONFUSABLE = {
      "а": "о", "о": "а", "е": "и", "и": "е",
      "я": "е", "у": "о", "ю": "у", "э": "е", "ы": "и"
    };

    const quizScreen = document.getElementById("quizScreen");
    const resultScreen = document.getElementById("resultScreen");

    const restartBtn = document.getElementById("restartBtn");
    const nextBtn = document.getElementById("nextBtn");
    const checkBtn = document.getElementById("checkBtn");

    const progressText = document.getElementById("progressText");
    const scoreText = document.getElementById("scoreText");
    const barFill = document.getElementById("barFill");
    const wordDisplay = document.getElementById("wordDisplay");
    const optionsBox = document.getElementById("options");
    const feedback = document.getElementById("feedback");

    const wrongWordsPanel = document.getElementById("wrongWordsPanel");
    const wrongWordsList = document.getElementById("wrongWordsList");

    const resultScore = document.getElementById("resultScore");
    const resultPercent = document.getElementById("resultPercent");
    const resultMark = document.getElementById("resultMark");
    const resultMessage = document.getElementById("resultMessage");
    const resultWrong = document.getElementById("resultWrong");
    const resultWrongList = document.getElementById("resultWrongList");

    let queue = [];
    let current = null;
    let score = 0;
    let mastered = new Set();
    let wrongWords = [];
    let totalUnique = 0;
    let questionNumber = 0;
    let answered = false;
    let selections = [];

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function capitalize(str) {
      if (!str) return str;
      return str.charAt(0).toLocaleUpperCase("ru") + str.slice(1);
    }

    function showScreen(name) {
      quizScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      if (name === "quiz") quizScreen.classList.remove("hidden");
      if (name === "result") resultScreen.classList.remove("hidden");
    }

    function parseStressedWord(stressed) {
      let clean = "";
      const stressedIndices = new Set();
      let i = 0;
      while (i < stressed.length) {
        const ch = stressed[i];
        if (ch === STRESS_MARK) { i++; continue; }
        if (VOWELS.includes(ch)) {
          const cleanIndex = clean.length;
          clean += ch;
          if (ch === "ё") {
            stressedIndices.add(cleanIndex);
          } else if (stressed[i + 1] === STRESS_MARK) {
            stressedIndices.add(cleanIndex);
            i++;
          }
        } else {
          clean += ch;
        }
        i++;
      }
      return { clean, stressedIndices };
    }

    function getBaseEnd(clean) {
      const stop = clean.search(/[\s(]/);
      return stop === -1 ? clean.length : stop;
    }

    function getEndingStart(clean, baseEnd) {
      if (baseEnd === 0) return 0;
      const lastIdx = baseEnd - 1;
      const lastChar = clean[lastIdx];

      if (VOWELS.includes(lastChar)) return lastIdx;

      if (lastChar === "й" && lastIdx > 0 && VOWELS.includes(clean[lastIdx - 1])) {
        return lastIdx - 1;
      }

      return baseEnd;
    }

    function getUnstressedVowelPositions(clean, stressedIndices) {
      const baseEnd = getBaseEnd(clean);
      const endingStart = getEndingStart(clean, baseEnd);
      const positions = [];

      for (let i = 0; i < baseEnd; i++) {
        if (VOWELS.includes(clean[i]) && !stressedIndices.has(i) && i < endingStart) {
          positions.push(i);
        }
      }

      return positions;
    }

    function choosePositions(positions) {
      if (positions.length <= MAX_BLANKS) return positions;
      return [positions[0], positions[positions.length - 1]];
    }

    function buildDisplay(clean, blanks) {
      const blankByIndex = new Map(blanks.map((blank, i) => [blank.index, i]));
      let html = "";
      for (let i = 0; i < clean.length; i++) {
        if (blankByIndex.has(i)) {
          const number = blankByIndex.get(i) + 1;
          html += `<span class="blank" aria-label="Пропуск ${number}"></span>`;
        } else {
          html += escapeHtml(clean[i]);
        }
      }
      return html;
    }

    function buildQuestion(stressedWord) {
      const { clean, stressedIndices } = parseStressedWord(stressedWord);
      const positions = getUnstressedVowelPositions(clean, stressedIndices);

      if (!positions.length) return null;

      const chosen = choosePositions(positions);
      const blanks = chosen.map(index => {
        const correct = clean[index];
        const other = CONFUSABLE[correct] || "о";
        return { index, correct, options: shuffle([correct, other]) };
      });

      return {
        word: clean,
        display: buildDisplay(clean, blanks),
        blanks,
        attempts: 0,
        isFirstAttempt: true,
        needsRepeat: false
      };
    }

    function startQuiz() {
      const uniqueWords = [...new Set(
        WORDS.map(word => word.toLocaleLowerCase("ru").trim())
      )];

      totalUnique = uniqueWords.length;
      queue = shuffle(uniqueWords)
        .map(buildQuestion)
        .filter(Boolean);

      score = 0;
      mastered.clear();
      wrongWords = [];
      questionNumber = 0;
      current = null;

      showScreen("quiz");
      nextQuestion();
    }

    function nextQuestion() {
      if (queue.length === 0) {
        finishQuiz();
        return;
      }

      current = queue.shift();
      current.attempts = (current.attempts || 0) + 1;
      current.isFirstAttempt = (current.attempts === 1);
      current.needsRepeat = false;

      answered = false;
      selections = new Array(current.blanks.length).fill(null);

      renderQuestion();
    }

    function renderQuestion() {
      progressText.textContent = `Вопрос ${questionNumber + 1}`;
      scoreText.textContent = `Баллы: ${score}`;

      const masteredRatio = totalUnique ? mastered.size / totalUnique : 0;
      barFill.style.width = `${masteredRatio * 100}%`;

      wordDisplay.innerHTML = current.display;

      optionsBox.innerHTML = "";
      feedback.className = "feedback";
      feedback.innerHTML = "";

      checkBtn.classList.remove("hidden");
      checkBtn.disabled = true;
      nextBtn.classList.add("hidden");

      renderWrongWordsPanel();

      current.blanks.forEach((blank, blankIndex) => {
        const group = document.createElement("div");
        group.className = "blank-group";

        const label = document.createElement("div");
        label.className = "blank-label";
        label.textContent = `Пропуск ${blankIndex + 1}`;

        const row = document.createElement("div");
        row.className = "letter-options";

        blank.options.forEach(letter => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "option";
          button.textContent = letter;
          button.dataset.blank = String(blankIndex);
          button.dataset.letter = letter;

          button.addEventListener("click", () => {
            if (answered) return;
            selections[blankIndex] = letter;
            const groupButtons = optionsBox.querySelectorAll(
              `.option[data-blank="${blankIndex}"]`
            );
            groupButtons.forEach(btn => {
              btn.classList.toggle("selected", btn.dataset.letter === letter);
            });
            checkBtn.disabled = selections.some(l => l === null);
          });

          row.appendChild(button);
        });

        group.appendChild(label);
        group.appendChild(row);
        optionsBox.appendChild(group);
      });
    }

    function renderWrongWordsPanel() {
      if (wrongWords.length === 0) {
        wrongWordsPanel.classList.add("hidden");
        return;
      }
      wrongWordsPanel.classList.remove("hidden");
      wrongWordsList.innerHTML = wrongWords
        .map(w => `<span class="wrong-word">${escapeHtml(capitalize(w))}</span>`)
        .join("");
    }

    function checkAnswers() {
      if (answered || selections.some(letter => letter === null)) return;
      answered = true;

      const allCorrect = current.blanks.every((blank, i) => {
        return selections[i] === blank.correct;
      });

      const isFirstAttempt = current.isFirstAttempt;

      if (allCorrect) {
        if (isFirstAttempt) score++;
        mastered.add(current.word);
      } else {
        if (isFirstAttempt && !wrongWords.includes(current.word)) {
          wrongWords.push(current.word);
        }
        if (current.attempts < MAX_ATTEMPTS) {
          current.needsRepeat = true;
        }
      }

      // Визуальная проверка
      const allButtons = [...optionsBox.querySelectorAll(".option")];
      allButtons.forEach(button => {
        const blankIndex = Number(button.dataset.blank);
        const letter = button.dataset.letter;
        const correct = current.blanks[blankIndex].correct;

        button.disabled = true;
        button.classList.remove("selected");

        if (letter === correct) {
          button.classList.add("correct");
        } else if (letter === selections[blankIndex]) {
          button.classList.add("wrong");
        }
      });

      const correctList = current.blanks
        .map((blank, i) => `${i + 1} — <b>${blank.correct}</b>`)
        .join(", ");

      if (allCorrect) {
        let msg = `<strong>Верно!</strong> Словарное слово: <b>${current.word}</b>.`;
        if (!isFirstAttempt) {
          msg = `<strong>Правильно!</strong> Словарное слово: <b>${current.word}</b>.`;
        }
        feedback.innerHTML = msg;
        feedback.className = "feedback ok";
      } else {
        let extra = "";
        if (current.needsRepeat) {
          extra = " Слово будет повторено позже.";
        } else if (current.attempts >= MAX_ATTEMPTS) {
          extra = " Попытки исчерпаны.";
        }
        feedback.innerHTML = `<strong>Неверно.</strong> Правильные буквы: ${correctList}. Словарное слово: <b>${current.word}</b>.${extra}`;
        feedback.className = "feedback bad";
      }

      scoreText.textContent = `Баллы: ${score}`;
      const masteredRatio = totalUnique ? mastered.size / totalUnique : 0;
      barFill.style.width = `${masteredRatio * 100}%`;

      renderWrongWordsPanel();

      checkBtn.classList.add("hidden");
      nextBtn.classList.remove("hidden");
      nextBtn.textContent = (queue.length === 0 && !current.needsRepeat)
        ? "Показать результат"
        : "Следующий вопрос";
    }

    function goNext() {
      if (!answered) return;

      if (current.needsRepeat) {
        // Вставляем повтор через 3–5 позиций
        const offset = MIN_OFFSET + Math.floor(Math.random() * (MAX_OFFSET - MIN_OFFSET + 1));
        const insertAt = Math.min(offset - 1, queue.length);
        const repeat = { ...current, needsRepeat: false };
        queue.splice(insertAt, 0, repeat);
      }

      questionNumber++;
      nextQuestion();
    }

    function finishQuiz() {
      const percent = totalUnique
        ? Math.round((score / totalUnique) * 100)
        : 0;

      let mark = "2";
      if (percent >= 90) mark = "5";
      else if (percent >= 75) mark = "4";
      else if (percent >= 60) mark = "3";

      resultScore.textContent = `${score} из ${totalUnique}`;
      resultPercent.textContent = `${percent}%`;
      resultMark.textContent = mark;

      if (wrongWords.length > 0) {
        resultWrong.classList.remove("hidden");
        resultWrongList.innerHTML = wrongWords
          .map(w => `<span class="wrong-word">${escapeHtml(capitalize(w))}</span>`)
          .join("");
      } else {
        resultWrong.classList.add("hidden");
        resultWrongList.innerHTML = "";
      }

      if (percent >= 90) {
        resultMessage.textContent = "Отличный результат! Словарные слова усвоены хорошо.";
      } else if (percent >= 75) {
        resultMessage.textContent = "Хороший результат. Обратите внимание на слова, где были ошибки.";
      } else if (percent >= 60) {
        resultMessage.textContent = "Есть над чем поработать. Повторите словарные слова и пройдите тест ещё раз.";
      } else {
        resultMessage.textContent = "Пока результат невысокий. Повторите тему «Безударные непроверяемые гласные в корне слова» и попробуйте снова.";
      }

      showScreen("result");
    }

    restartBtn.addEventListener("click", startQuiz);
    checkBtn.addEventListener("click", checkAnswers);
    nextBtn.addEventListener("click", goNext);

    // Тест запускается сразу при открытии страницы.
    startQuiz();
  </script>
</body>
</html>
